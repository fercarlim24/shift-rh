services:
  db:
    image: postgres:16-alpine
    container_name: shift-rh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shift_rh
      POSTGRES_USER: shift_rh
      POSTGRES_PASSWORD: shift_rh
    ports:
      - "54329:5432"
    volumes:
      - shift_rh_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shift_rh -d shift_rh"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  shift_rh_postgres:
